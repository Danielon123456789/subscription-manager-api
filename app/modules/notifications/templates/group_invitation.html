<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Invitation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
  <div style="max-width: 480px; margin: 0 auto; background-color: #ffffff; padding: 24px; border-radius: 8px;">
    <h2 style="margin-top: 0;">You've been invited to a group</h2>
    <p>Hi,</p>
    <p><strong>{{ inviter_name }}</strong> has invited you to join the group <strong>{{ group_name }}</strong>.</p>
    <p style="color: #888888; font-size: 12px;">If you weren't expecting this message, you can ignore it.</p>
  </div>
</body>
</html>
